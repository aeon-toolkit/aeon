name: PR pre-commit

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Get changed files
        if: ${{ github.event_name == 'pull_request' }}
        uses: tj-actions/changed-files@v47.0.6
        id: changed-files

      # File names come from the PR, so pass them through the environment rather than
      # expanding them into the shell commands
      - name: List changed files
        if: ${{ github.event_name == 'pull_request' }}
        run: echo "$CHANGED_FILES"
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-3|${{ env.pythonLocation }}|${{ hashFiles('.pre-commit-config.yaml') }}

      # Check the full repository on pushes to main
      - name: Full pre-commit
        if: ${{ github.event_name == 'push' }}
        run: pre-commit run --show-diff-on-failure --color=always --all-files

      # Check the full repository on PRs that are explicitly labelled
      - name: Full pre-commit on labelled PR
        if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full pre-commit') }}
        run: pre-commit run --show-diff-on-failure --color=always --all-files

      # Otherwise only check changed files on PRs
      - name: Local pre-commit
        if: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full pre-commit') }}
        run: pre-commit run --show-diff-on-failure --color=always --files $CHANGED_FILES
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}

  codespell-annotations:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Annotate locations with typos
        uses: codespell-project/codespell-problem-matcher@v1

      # Annotations only, the pre-commit codespell hook is the check that fails the PR
      - name: Codespell
        uses: codespell-project/actions-codespell@v2
        with:
          only_warn: 1
